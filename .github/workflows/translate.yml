name: Translate & Sync to Notion

on:
  schedule:
    # Daily at 01:00 UTC, an hour after monitor.yml (00:00 UTC) — translates
    # new/changed pages from the latest snapshot and syncs them to Notion.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      char_budget:
        description: "Max source characters to translate this run (blank = use config.yaml's value)"
        required: false
        default: ""
      skip_notion:
        description: "Skip the Notion sync step (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: hive-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r monitor/requirements.txt

      - name: Translate new/changed pages (DeepL)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATE_CHAR_BUDGET: ${{ github.event.inputs.char_budget }}
        run: python monitor/translate.py

      - name: Sync translations to Notion
        if: ${{ github.event.inputs.skip_notion != 'true' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python monitor/notion_sync.py

      - name: Commit translations
        run: |
          if [[ -n "$(git status --porcelain translations/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add translations/
            git commit -m "chore: update translations"
            git pull --rebase
            git push
          else
            echo "No translation changes to commit."
          fi
