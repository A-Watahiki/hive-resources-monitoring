name: Inspect page structure (diagnostic)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to inspect"
        required: true
        default: "https://resources.joinhive.org/library/ai-prompts/advertisements"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r monitor/requirements.txt
      - name: Inspect
        env:
          INSPECT_URL: ${{ github.event.inputs.url }}
        run: python monitor/inspect_page.py
