name: Monitor Hive Resource Library
on:
  schedule:
    # Checks once a day at 00:00 UTC. Edit the cron expression below to
    # change the time (minute hour day month weekday, all in UTC).
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Manual trigger — run this from the Actions tab with "Run workflow"
    # for an immediate check.
    inputs:
      dry_run:
        description: "Log the detected diff without sending an email (true/false)"
        required: false
        default: "false"

# Write access is needed to commit and push the updated state.json snapshot.
permissions:
  contents: write

concurrency:
  group: hive-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r monitor/requirements.txt

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python monitor/monitor.py

      - name: Commit updated snapshot
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -n "$(git status --porcelain snapshots/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add snapshots/
            git commit -m "chore: update Hive library snapshot"
            git pull --rebase
            git push
          else
            echo "No snapshot changes to commit."
          fi
