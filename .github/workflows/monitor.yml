name: Monitor Hive Resource Library
on:
  schedule:
    # 毎日 00:00 UTC（日本時間 09:00）に1回チェック。
    # 時刻を変えたい場合は下の cron 式を編集してください（分 時 日 月 曜日, UTC基準）。
    - cron: "0 0 * * *"
  workflow_dispatch:
    # 手動実行用。Actions 画面から「Run workflow」で即時チェックできます。
    inputs:
      dry_run:
        description: "メールを送らず差分のみログ出力する (true/false)"
        required: false
        default: "false"

# state.json をコミットして push するために write 権限が必要。
permissions:
  contents: write

concurrency:
  group: hive-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r monitor/requirements.txt

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python monitor/monitor.py

      - name: Commit updated snapshot
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -n "$(git status --porcelain snapshots/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add snapshots/
            git commit -m "chore: update Hive library snapshot"
            git push
          else
            echo "No snapshot changes to commit."
          fi
