name: Archive Notion pages (cleanup)

on:
  workflow_dispatch:
    inputs:
      page_ids:
        description: "Comma-separated Notion page IDs to move to trash"
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r monitor/requirements.txt
      - name: Archive
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ARCHIVE_PAGE_IDS: ${{ github.event.inputs.page_ids }}
        run: python monitor/archive_pages.py
